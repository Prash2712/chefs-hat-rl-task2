[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "companyscope-uk"
version = "0.1.0"
description = "Companies House corporate intelligence and transparent governance-screening service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pandas>=2.2,<3",
  "pydantic>=2.8,<3",
  "requests>=2.32,<3",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
companyscope = "companyscope.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
